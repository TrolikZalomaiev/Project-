<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список фильмов</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background: #121212;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 40px 20px;
            color: #e0e0e0;
        }

        .nav-box {
            max-width: 800px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            animation: fadeIn 1s ease-out;
        }

        .btn-back {
            color: #b0b0b0;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .btn-upload {
            background: #ffffff;
            color: #121212;
            border: none;
            font-weight: 600;
            font-size: 14px;
            padding: 10px 22px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-upload:hover {
            background: #e0e0e0;
            transform: translateY(-1px);
        }

        h2 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 40px;
            font-weight: 500;
            letter-spacing: 0.5px;
            animation: fadeIn 1.2s ease-out;
        }

        .gallery {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 800px;
            width: 100%;
            animation: fadeIn 1.5s ease-out;
            padding-bottom: 40px;
        }

        .movie-card {
            position: relative;
            background: #1e1e1e;
            padding: 18px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
        }

        .movie-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .movie-card.watched {
            opacity: 0.5;
        }

        .movie-card.watched .movie-title {
            text-decoration: line-through;
        }

        .movie-details {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            padding-right: 15px;
        }

        .movie-title {
            font-size: 17px;
            font-weight: 600;
            color: #ffffff;
        }

        .movie-info {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 13px;
            color: #b0b0b0;
        }

        .movie-genre {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 8px;
            border-radius: 6px;
        }

        .movie-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-watched {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #b0b0b0;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-watched:hover {
            border-color: #ffffff;
            color: #ffffff;
        }

        .movie-card.watched .btn-watched {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-color: transparent;
        }

        .btn-delete {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            opacity: 0.6;
            padding: 6px;
            transition: opacity 0.2s;
        }

        .btn-delete:hover {
            opacity: 1;
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal {
            background: #1e1e1e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px;
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
            text-align: left;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .modal h3 {
            color: #ffffff;
            font-size: 18px;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .modal label {
            display: block;
            font-size: 12px;
            color: #b0b0b0;
            margin-bottom: 6px;
        }

        .modal input {
            width: 100%;
            background: #121212;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 14px;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
        }

        .modal input:focus {
            border-color: rgba(255, 255, 255, 0.3);
        }

        .genres-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .genre-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .genre-chip:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .genre-chip.selected {
            background: #ffffff;
            color: #121212;
            font-weight: 600;
            border-color: #ffffff;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.05);
            color: #b0b0b0;
        }

        .btn-submit {
            background: #ffffff;
            color: #121212;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="nav-box">
        <a href="index.html" class="btn-back">← Главная</a>
        <button id="add_movie_btn" class="btn-upload">+ Добавить фильм</button>
    </div>

    <h2>Список фильмов к просмотру</h2>

    <div class="gallery" id="gallery"></div>

    <!-- Модальное окно ввода фильма -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3>Добавить фильм</h3>
            
            <label>Название фильма</label>
            <input type="text" id="movieTitleInput" placeholder="Например: Начало">

            <label>Год (необязательно)</label>
            <input type="text" id="movieYearInput" placeholder="2010">

            <label>Жанр</label>
            <div class="genres-grid" id="genresGrid">
                <div class="genre-chip selected" data-genre="Драма">Драма</div>
                <div class="genre-chip" data-genre="Комедия">Комедия</div>
                <div class="genre-chip" data-genre="Боевик">Боевик</div>
                <div class="genre-chip" data-genre="Триллер">Триллер</div>
                <div class="genre-chip" data-genre="Ужасы">Ужасы</div>
                <div class="genre-chip" data-genre="Фантастика">Фантастика</div>
                <div class="genre-chip" data-genre="Мелодрама">Мелодрама</div>
                <div class="genre-chip" data-genre="Детектив">Детектив</div>
            </div>

            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" id="modalCancel">Отмена</button>
                <button class="modal-btn btn-submit" id="modalSubmit">Добавить</button>
            </div>
        </div>
    </div>

    <script>
        const BASE_FIREBASE_URL = "https://films-c651e-default-rtdb.firebaseio.com";

        const gallery = document.getElementById('gallery');
        let renderedKeys = new Set();
        let selectedGenre = "Драма";

        document.querySelectorAll('.genre-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.genre-chip').forEach(c => c.classList.remove('selected'));
                chip.classList.add('selected');
                selectedGenre = chip.getAttribute('data-genre');
            });
        });

        const modalOverlay = document.getElementById('modalOverlay');
        const addMovieBtn = document.getElementById('add_movie_btn');
        const modalCancel = document.getElementById('modalCancel');
        const modalSubmit = document.getElementById('modalSubmit');
        const titleInput = document.getElementById('movieTitleInput');
        const yearInput = document.getElementById('movieYearInput');

        addMovieBtn.addEventListener('click', () => {
            titleInput.value = '';
            yearInput.value = '';
            modalOverlay.style.display = 'flex';
        });

        modalCancel.addEventListener('click', () => {
            modalOverlay.style.display = 'none';
        });

        modalSubmit.addEventListener('click', () => {
            const title = titleInput.value.trim();
            if (!title) {
                alert("Введите название фильма!");
                return;
            }

            saveMovieToFirebase(title, selectedGenre, yearInput.value.trim());
            modalOverlay.style.display = 'none';
        });

        function renderMovie(key, data) {
            if (renderedKeys.has(key)) return;
            renderedKeys.add(key);

            const card = document.createElement('div');
            card.className = `movie-card ${data.watched ? 'watched' : ''}`;
            card.id = `movie-${key}`;

            card.innerHTML = `
                <div class="movie-details">
                    <div class="movie-title">${escapeHtml(data.title)}</div>
                    <div class="movie-info">
                        <span class="movie-genre">${escapeHtml(data.genre)}</span>
                        ${data.year ? `<span>• ${escapeHtml(data.year)}</span>` : ''}
                    </div>
                </div>
                <div class="movie-actions">
                    <button class="btn-watched" onclick="toggleWatched('${key}', ${!data.watched})">
                        ${data.watched ? '✓ Просмотрено' : 'Смотреть'}
                    </button>
                    <button class="btn-delete" onclick="deleteMovie('${key}')" title="Удалить">🗑️</button>
                </div>
            `;

            gallery.prepend(card);
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        async function loadMovies() {
            try {
                const response = await fetch(`${BASE_FIREBASE_URL}.json`);
                const data = await response.json();
                if (data) {
                    Object.entries(data).forEach(([key, item]) => {
                        if (item && item.title) renderMovie(key, item);
                    });
                }
            } catch (e) {
                console.error("Ошибка загрузки:", e);
            }
        }

        async function saveMovieToFirebase(title, genre, year) {
            try {
                const res = await fetch(`${BASE_FIREBASE_URL}.json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        title: title, 
                        genre: genre,
                        year: year || '',
                        watched: false,
                        timestamp: Date.now() 
                    })
                });
                const data = await res.json();
                if (data && data.name) {
                    renderMovie(data.name, { title, genre, year, watched: false });
                }
            } catch (e) {
                console.error("Ошибка сохранения:", e);
            }
        }

        window.toggleWatched = async function(key, newStatus) {
            try {
                await fetch(`${BASE_FIREBASE_URL}/${key}/watched.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newStatus)
                });
                
                const card = document.getElementById(`movie-${key}`);
                if (card) {
                    card.classList.toggle('watched', newStatus);
                    const btn = card.querySelector('.btn-watched');
                    btn.innerHTML = newStatus ? '✓ Просмотрено' : 'Смотреть';
                    btn.setAttribute('onclick', `toggleWatched('${key}', ${!newStatus})`);
                }
            } catch (e) {
                alert("Ошибка обновления статуса!");
            }
        }

        window.deleteMovie = async function(key) {
            if (confirm("Точно удалить этот фильм из списка?")) {
                try {
                    await fetch(`${BASE_FIREBASE_URL}/${key}.json`, {
                        method: 'DELETE'
                    });
                    const card = document.getElementById(`movie-${key}`);
                    if (card) card.remove();
                    renderedKeys.delete(key);
                } catch (e) {
                    alert("Ошибка при удалении!");
                }
            }
        }

        loadMovies();
    </script>
</body>
</html>
