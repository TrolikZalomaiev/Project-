<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>фото ✨</title>
    <!-- Подключаем клиент Supabase через CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 30px 20px;
            position: relative;
        }

        .btn-back {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff4b6e;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            padding: 10px 18px;
            border-radius: 50px;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(255, 75, 110, 0.1);
            transition: transform 0.2s, background 0.2s;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 1);
        }

        h1 {
            color: #4a4a4a;
            font-size: 26px;
            margin-top: 40px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p.subtitle {
            color: #777;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        .photo-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 75, 110, 0.1);
            border: 2px solid rgba(255, 194, 209, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .photo-card:hover {
            transform: translateY(-5px);
        }

        .photo-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 10px;
        }

        .photo-caption {
            color: #555;
            font-size: 14px;
            font-weight: 500;
            padding: 5px;
        }

        .loading {
            color: #777;
            font-size: 16px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-back">← Назад</a>

    <h1>фото ✨</h1>
    <p class="subtitle">Самые уютные и тёплые моменты</p>

    <div id="loading" class="loading"></div>
    <div class="gallery-grid" id="galleryGrid"></div>

    <script>
        // Инициализация Supabase с твоими новыми ключами
        const SUPABASE_URL = 'https://avfabbcfwjtpievmpyjl.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_zIMkSuhL2LtreDRyKVw5BA_Q6Tnib5O';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadGallery() {
            const grid = document.getElementById('galleryGrid');
            const loading = document.getElementById('loading');

            // Замени 'photos' на название своей таблицы в Supabase, если оно отличается
            const { data, error } = await supabaseClient
                .from('photos')
                .select('*')
                .order('created_at', { ascending: false });

            loading.style.display = 'none';

            if (error) {
                console.error('Ошибка загрузки:', error);
                grid.innerHTML = '<p style="color: #ff4b6e; grid-column: 1/-1;">Не удалось загрузить фотографии...</p>';
                return;
            }

            if (!data || data.length === 0) {
                grid.innerHTML = '<p style="color: #777; grid-column: 1/-1;">Здесь пока пусто...</p>';
                return;
            }

            grid.innerHTML = '';
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `
                    <img src="${item.image_url || item.url}" alt="Фото">
                    <div class="photo-caption">${item.caption || item.title || '🤍'}</div>
                `;
                grid.appendChild(card);
            });
        }

        loadGallery();
    </script>
</body>
</html>
